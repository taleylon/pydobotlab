# Constants of the pydobotlab control panel: shortcut, hub text, and alarm text.
# Read by panel_config.py. Per-user settings are in pydobotlab/config.toml.
# Alarm codes and names: docs/Dobot-Magician-ALARM-Description.pdf.

# The application, and the shortcuts made by pydobotlab-panel --create-shortcut.
[shortcut]
name = "pydobotlab Panel"                       # shown under the shortcut
comment = "Control panel for the Dobot Magician"
application_name = "pydobotlab"                 # Qt application name; the window class on Linux
desktop_id = "pydobotlab-panel"                 # Linux: name of the .desktop file
categories = "Education;Science;Engineering;"   # Linux: application menu categories
windows_app_id = "pydobotlab.panel"             # Windows: groups the panel's windows on the taskbar

# Printed by pydobotlab-panel --create-shortcut. {path} is a shortcut's file.
[shortcut.messages]
created = "Created {path}"
all_users = "Every user finds the panel in the application menu. For a desktop icon, a user runs pydobotlab-panel --create-shortcut without sudo."
allow_launching = "If the desktop icon shows a warning, right-click it and choose Allow Launching."
not_supported = "Shortcuts can be created on Windows and Linux."
failed = "Could not create the shortcut: {error}"

# Shown when the scan finds no Dobot Magician. The ports that were tried are
# listed only in developer mode (--dev).
[hub.not_found]
note = "No Dobot Magician devices were found.\nCheck the USB cable and power, then click Refresh."
busy = "A serial port is busy. Close the script or program using it, then click Refresh."
affected_ports = "Affected ports: {ports}"
status = "no Dobot Magician devices found"
status_ports_tried = "no Dobot Magician devices found; ports tried: {count} - hover for details"

# Ports in the device list that could not be opened, by reason (--dev).
[hub.port_problems]
busy = "port is busy: close the script or program using it, then Refresh"
other = "couldn't open"

# Asked before quitting while scripts are connected through the panel.
# {count} is the number of scripts.
[hub.quit_dialog]
title = "Scripts connected"
one_script = "1 script is connected to an arm through the control panel.\nQuitting disconnects it from the arm.\n\nQuit anyway?"
several_scripts = "{count} scripts are connected to an arm through the control panel.\nQuitting disconnects them from the arm.\n\nQuit anyway?"

# Shown at startup when the panel cannot start the service that lets scripts
# share the arms (the broker). {port} is its TCP port and {error} the cause.
[hub.broker_failed]
title = "Panel service not started"
text = "The panel could not start its connection service on port {port}: {error}\nAnother program may be using that port. Close it, then restart the panel. Until then, no arm can be opened."

# Shown when the arm does not answer the control panel.
[connection]
not_responding = "The arm is not responding. Check that it is turned on and its USB cable is connected, then press Reconnect."

# A target typed into the pose readout. {name} is X, Y, Z, R, or J1 to J4,
# {value} the typed value, and {error} the error's first line.
[pose_entry]
tooltip = "Click to type a target. Enter moves the arm; Esc cancels."
moving = "moving to {name} = {value:.2f}..."
done = "move complete"
refused = "the arm refused the move - see the alarm"
failed = "move failed: {error}"

[alarm_text]
# Joint names in alarm messages, for joints 1 to 4.
joint_names = ["base (J1)", "rear arm (J2)", "forearm (J3)", "end-effector rotation (J4)"]
unknown = "Unknown alarm. Press Clear Alarm; if it comes back, power-cycle the arm."

# One line per alarm group. {joint} is the joint's name and {number} its number.
# A joint-limit alarm ends by itself when the joint is jogged back off the limit.
[alarm_text.groups]
system = "System fault. Power-cycle the arm."
out_of_reach = "The target is out of reach. Press Clear Alarm and choose a reachable target."
overspeed = "The {joint} moved too fast. Lower the speed, then press Clear Alarm."
positive_limit = "The {joint} reached its limit. Jog J{number}- to move it back."
negative_limit = "The {joint} reached its limit. Jog J{number}+ to move it back."
joint_limit = "A joint reached its limit. Jog it back the other way."
lost_step = "The {joint} lost steps. Press Home."

# Text for single alarms, by alarm name. It replaces the group's line.
[alarm_text.alarms]
PUBLIC_RESET = "The arm was reset. Press Clear Alarm."
PUBLIC_UNDEFINED_INSTRUCTION = "The arm received an unknown command. Press Clear Alarm."
PLAN_INVERSE_SINGULARITY = "The target is in a pose the arm cannot take. Press Clear Alarm and choose another target."
PLAN_INVERSE_LIMIT = "The target needs a joint beyond its limit. Press Clear Alarm and choose another target."
PLAN_DATA_REPEAT = "The move repeats a point. Press Clear Alarm and change the points."
PLAN_ARC_INPUT_PARAMETER = "The arc points are invalid. Press Clear Alarm and change them."
PLAN_JUMP_PARAMETER = "The JUMP parameters are invalid. Press Clear Alarm and change them."
MOVE_INVERSE_SINGULARITY = "The path passes a pose the arm cannot follow. Press Clear Alarm and change the path."
MOVE_INVERSE_LIMIT = "The path needs a joint beyond its limit. Press Clear Alarm and change the path."
LIMIT_POS_PARALLELOGRAM = "The arm is stretched to its limit. Jog back the way it came."
LIMIT_NEG_PARALLELOGRAM = "The arm is folded to its limit. Jog back the way it came."
