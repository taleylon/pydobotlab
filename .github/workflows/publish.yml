name: Publish package

# Merging a pull request from a version branch (v0.2, v1.0.1, ...) into main
# publishes to PyPI when the branch name matches __version__ in
# pydobotlab/__init__.py and that version is higher than every published
# version. A version that is already published is skipped; a lower one fails.
# Other pushes to main publish nothing. A manual run can publish to TestPyPI
# from any ref, or to PyPI from the tag v<version>.
# The rules are in scripts/check_release_version.py.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destination:
        description: Package index
        type: choice
        required: true
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.destination || 'pypi' }}
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      destination: ${{ inputs.destination || 'pypi' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - name: Publish only a merged version branch with a higher version
        id: version
        env:
          DESTINATION: ${{ inputs.destination || 'pypi' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_version.py

  validate:
    needs: check-release
    if: needs.check-release.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check-release, validate]
    if: needs.check-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.check-release.outputs.destination }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Publish to TestPyPI
        if: needs.check-release.outputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: needs.check-release.outputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
